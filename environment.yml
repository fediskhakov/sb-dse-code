name: eco629
channels:
  - conda-forge
dependencies:
  - python >=3.11
  # Scientific stack used by the lecture code
  - numpy
  - pandas
  - scipy
  - matplotlib
  - sympy
  # Kernel and JupyterLab used to run the notebooks
  - ipykernel
  - jupyterlab
  # IPython.display, used by the animated notebooks
  - ipython
  # line-by-line profiling in the NFXP practical
  - line_profiler
  # optimization, and maximum likelihood with inference (estimagic), in the CCP practical
  - optimagic
